            main.innerHTML = html;
        }

        // ============ POINTAGES ============
        // Jusqu a la bascule, la source est Combo : prevu, pointe et valide y sont complets.
        function ptDuree(debut, fin, pauses) {
            if (!debut || !fin) return null;
            return Math.round((new Date(fin) - new Date(debut)) / 60000) - (pauses || 0);
        }
        function ptPrevu(p) { return ptDuree(p.debut_planifie, p.fin_planifiee, p.pauses_planifiees_minutes); }
        function ptPointe(p) { return ptDuree(p.debut_pointe, p.fin_pointee, p.pauses_pointees_minutes); }
        function ptValide(p) { return ptDuree(p.debut_valide, p.fin_validee, p.pauses_validees_minutes); }
        function ptSomme(liste, f) { return liste.reduce((t, p) => t + (f(p) || 0), 0); }
        function ptHeure(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
        function ptPlage(debut, fin) { return debut ? ptHeure(debut) + ' – ' + (fin ? ptHeure(fin) : '?') : '—'; }
        function ptEcart(min) {
            if (Math.abs(min) < 1) return '0';
            return `<span class="${min > 0 ? 'ecart-pos' : 'ecart-neg'}">${min > 0 ? '+' : '−'}${hLib(min)}</span>`;
        }
        function ptStatut(p) {
            if (!p.debut_pointe) return { lib: 'Sans pointage', cls: 'refaire' };
            if (!p.fin_pointee) return { lib: 'Fin non pointée', cls: 'refaire' };
            if (!p.debut_valide || !p.fin_validee) return { lib: 'À valider', cls: 'attente' };
            return { lib: 'Validé', cls: 'ok' };
        }
        function ptAVerifier(p) { return ptStatut(p).cls !== 'ok'; }

        function construireRecapPointages() {
            const parSalarie = new Map();
            for (const p of pointages.filter(ici)) {
                const cle = p.user_id || p.collaborateur_nom_combo;
                if (!parSalarie.has(cle)) {
                    const u = p.user_id ? userDe(p.user_id) : null;
                    parSalarie.set(cle, { cle, user_id: p.user_id, nom: u ? u.nom : p.collaborateur_nom_combo, equipe: normEquipe(p.equipe), lignes: [] });
                }
                parSalarie.get(cle).lignes.push(p);
            }
            return [...parSalarie.values()].sort((a, b) => ORDRE_EQUIPES.indexOf(a.equipe) - ORDRE_EQUIPES.indexOf(b.equipe) || a.nom.localeCompare(b.nom, 'fr'));
        }

        function basculerPointage(i) {
            const cle = ptListe[i].cle;
            if (ptOuverts.has(cle)) ptOuverts.delete(cle); else ptOuverts.add(cle);
            renderPointages();
        }

        function renderDetailPointage(s) {
            const lignesJour = s.lignes.slice().sort((a, b) => a.date_service.localeCompare(b.date_service) || String(a.debut_planifie).localeCompare(String(b.debut_planifie)));
            return `<tr><td colspan="7" class="pt-detail"><div class="scroll"><table class="pt-jours">
                <tr><th>Jour</th><th>Prévu</th><th>Pointé</th><th>Validé</th><th>Durée validée</th><th>État</th></tr>
                ${lignesJour.map(p => {
                    const st = ptStatut(p);
                    const v = ptValide(p);
                    return `<tr><td>${esc(dateDe(p.date_service).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' }))}</td>
                        <td>${ptPlage(p.debut_planifie, p.fin_planifiee)}</td>
                        <td>${ptPlage(p.debut_pointe, p.fin_pointee)}</td>
                        <td>${ptPlage(p.debut_valide, p.fin_validee)}</td>
                        <td>${v == null ? '—' : hLib(v)}</td>
                        <td><span class="statut ${st.cls}">${st.lib}</span></td></tr>`;
                }).join('')}
            </table></div></td></tr>`;
        }

        function renderPointages() {
            const main = document.getElementById('main');
            const j = joursSemaine();
            let html = `<div class="nav">
                <button onclick="changerSemaine(-1)">‹</button>
                <div class="lib">${libSemaine()}<small>Pointages Combo · lecture seule</small></div>
                <button onclick="changerSemaine(1)">›</button>
            </div>`;
            if (j[0] >= DATE_BASCULE) {
                main.innerHTML = html + '<div class="card"><div class="empty">À partir du 1er janvier 2027, les heures se suivent dans le module Équipe, onglet Validation des heures.</div></div>';
                return;
            }
            const ici7 = pointages.filter(ici);
            ptListe = construireRecapPointages();
            const aVerifier = ici7.filter(ptAVerifier).length;
            html += `<div class="kpis">
                <div class="kpi"><div class="lbl">Heures prévues</div><div class="val">${hDec(ptSomme(ici7, ptPrevu))}</div></div>
                <div class="kpi"><div class="lbl">Heures pointées</div><div class="val">${hDec(ptSomme(ici7, ptPointe))}</div></div>
                <div class="kpi"><div class="lbl">Heures validées</div><div class="val" style="color:var(--green)">${hDec(ptSomme(ici7, ptValide))}</div></div>
                <div class="kpi"><div class="lbl">Services à vérifier</div><div class="val" style="color:${aVerifier ? 'var(--orange)' : 'var(--gray-400)'}">${aVerifier}</div></div>
            </div>`;
            if (!ptListe.length) {
                main.innerHTML = html + '<div class="card"><div class="empty">Aucun pointage reçu de Combo pour cette semaine.</div></div>';
                return;
            }
            const terminee = j[6] < isoLocal(new Date());
            html += `<div class="actions no-print"><span class="espace"></span><button class="btn-small" onclick="window.print()">🖨️ Imprimer</button></div>`;
            html += `<div class="card"><div class="card-head"><span>Récapitulatif par salarié</span><span class="sub">Touche un nom pour voir le détail des jours</span></div>
                <div class="scroll"><table class="liste pt-table">
                <tr><th>Salarié</th><th class="num">Prévu</th><th class="num">Pointé</th><th class="num">Validé</th><th class="num">Validé − prévu</th><th class="num">Contrat</th><th class="num">Écart contrat</th></tr>`;
            let equipe = null;
            ptListe.forEach((s, i) => {
                if (s.equipe !== equipe) { equipe = s.equipe; html += `<tr class="pt-groupe"><td colspan="7">${LIB_EQUIPE[equipe]}</td></tr>`; }
                const prevu = ptSomme(s.lignes, ptPrevu);
                const pointe = ptSomme(s.lignes, ptPointe);
                const valide = ptSomme(s.lignes, ptValide);
                // Un salarie partage : le contrat se compare au total des deux etablissements
                const ailleurs = s.user_id ? ptSomme(pointages.filter(p => p.user_id === s.user_id && !ici(p)), ptValide) : 0;
                const c = s.user_id ? contratDeLaSemaine(s.user_id) : null;
                const nb = s.lignes.filter(ptAVerifier).length;
                const ouvert = ptOuverts.has(s.cle);
                const ecartContrat = !c ? '<span class="muted">—</span>'
                    : terminee ? ptEcart(valide + ailleurs - Number(c.heures_hebdo) * 60)
                    : '<span class="muted">semaine en cours</span>';
                html += `<tr class="pt-ligne" onclick="basculerPointage(${i})">
                    <td class="pt-nom">${ouvert ? '▾' : '▸'} ${esc(s.nom)}${nb ? ` <span class="pastille">${nb}</span>` : ''}${ailleurs ? `<small>+ ${hLib(ailleurs)} validées dans l’autre établissement</small>` : ''}</td>
                    <td class="num">${hLib(prevu)}</td>
                    <td class="num">${hLib(pointe)}</td>
                    <td class="num">${hLib(valide)}</td>
                    <td class="num">${ptEcart(valide - prevu)}</td>
                    <td class="num">${c ? Number(c.heures_hebdo).toLocaleString('fr-FR') + ' h' : '<span class="muted">—</span>'}</td>
                    <td class="num">${ecartContrat}</td>
                </tr>`;
                if (ouvert) html += renderDetailPointage(s);
            });
            html += '</table></div></div>';
            main.innerHTML = html;
        }

        // ============ MON PLANNING ============
        function mesLignes() {
            const j = joursSemaine();
            const source = peutGerer ? monPublie : lignes;
            return source.filter(s => s.user_id === currentUser.id && s.date_service >= j[0] && s.date_service <= j[6]);
        }
        let monPublie = [];

        function renderMoi() {
            const main = document.getElementById('main');
            const j = joursSemaine();
            const miens = mesLignes();
            const total = miens.reduce((t, s) => t + dureeNette(s), 0);
            const e = signatures.find(s => s.user_id === currentUser.id) || null;

            let html = `<div class="nav">
                <button onclick="changerSemaine(-1)">‹</button>
                <div class="lib">${libSemaine()}<small>${esc(currentUser.nom)} · ${hLib(total)} planifiées</small></div>
                <button onclick="changerSemaine(1)">›</button>
            </div><div class="card">`;
            if (!miens.length) {
                html += '<div class="empty">Aucun planning publié pour toi cette semaine.</div></div>';
                main.innerHTML = html;
                return;
            }
            for (const d of j) {
                const duJour = miens.filter(s => s.date_service === d).sort((a, b) => hhmm(a.heure_debut).localeCompare(hhmm(b.heure_debut)));
                const lib = dateDe(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric' });
                html += `<div class="moi-jour"><div class="j">${esc(lib)}</div><div class="d">`;
                if (!duJour.length) html += '<span class="repos">Repos</span>';
                for (const s of duJour) {
                    if (s.nature !== 'travail') { html += `<div>${esc(LIB_NATURE[s.nature] || s.nature)}</div>`; continue; }
                    const info = [LIB_ETAB[s.etablissement], s.pause_minutes ? 'pause ' + s.pause_minutes + ' min' : '', s.poste].filter(Boolean).join(' · ');
                    html += `<div>${hhmm(s.heure_debut)} – ${hhmm(s.heure_fin)}<small>${esc(info)}</small></div>`;
                }
                html += '</div></div>';
            }
            html += '</div>';
            if (e && e.a_jour) {
                html += `<div class="info" style="background:var(--green-light);border-color:#bbf7d0;color:var(--green)">✅ Tu as signé ce planning le ${new Date(e.signe_le).toLocaleDateString('fr-FR')}.</div>`;
            } else {
                if (e && e.signe_le) html += `<div class="info" style="background:var(--orange-light);border-color:#fed7aa;color:var(--orange)">Ton planning a changé depuis ta dernière signature. Relis-le, puis signe à nouveau.</div>`;
                html += `<div class="actions"><button class="btn-primary" onclick="ouvrirSignature()">✍️ Signer ma semaine</button></div>`;
            }
            main.innerHTML = html;
        }

        function ouvrirSignature() {
            document.getElementById('sig-sub').textContent = 'En signant, tu confirmes avoir pris connaissance de ton planning. ' + libSemaine() + '.';
            document.getElementById('sig-pin').value = '';
            document.getElementById('signature-modal').style.display = 'flex';
            document.getElementById('sig-pin').focus();
        }

        async function signer() {
            const pin = document.getElementById('sig-pin').value.trim();
            if (!pin) { showToast('Saisis ton code', 'error'); return; }
            try {
                const { error } = await sb.rpc('pbt_planning_signer', { p_lundi: isoLocal(semaineDebut), p_pin: pin });
                if (error) throw error;
                fermerModale('signature-modal');
                showToast('Planning signé', 'success');
                await recharger();
            } catch (e) {
                console.error(e);
                if (PLANB.erreurAuth(e)) return;
                showToast(String(e.message || '').includes('Code incorrect') ? 'Code incorrect' : (String(e.message || '').includes('Trop de tentatives') ? e.message : 'Erreur de signature'), 'error');
            } finally {
                document.getElementById('sig-pin').value = '';
            }
        }

        // ============ HORAIRES TYPES ============
        function renderModeles() {
            const main = document.getElementById('main');
            const liste = modeles.filter(m => m.etablissement === currentEstablishment);
            let html = `<div class="actions"><button class="btn-primary" onclick="ouvrirModele(null)">+ Nouvel horaire type</button></div>`;
            for (const eq of ORDRE_EQUIPES) {
                const duGroupe = liste.filter(m => m.equipe === eq);
                if (!duGroupe.length) continue;
                html += `<div class="card"><div class="card-head">${LIB_EQUIPE[eq]}</div><table class="liste">
                    <tr><th>Nom</th><th>Horaires</th><th class="num">Pause</th><th class="num">Durée</th><th></th></tr>`;
                for (const m of duGroupe) {
                    const net = dureeBrute(m) - (m.pause_minutes || 0);
                    html += `<tr><td><b>${esc(m.libelle)}</b></td><td>${hhmm(m.heure_debut)} – ${hhmm(m.heure_fin)}</td><td class="num">${m.pause_minutes} min</td><td class="num">${hLib(net)}</td>
                        <td style="text-align:right;white-space:nowrap"><button class="btn-small" onclick="ouvrirModele('${m.id}')">✏️</button> <button class="btn-small" onclick="demanderRetraitModele('${m.id}')">🗑️</button></td></tr>`;
                }
                html += '</table></div>';
            }
            if (!liste.length) html += '<div class="card"><div class="empty">Aucun horaire type.</div></div>';
            main.innerHTML = html;
        }

        function ouvrirModele(id) {
            const m = id ? modeles.find(x => x.id === id) : null;
            modeleEdition = m;
            document.getElementById('m-titre').textContent = m ? 'Modifier l’horaire type' : 'Nouvel horaire type';
            document.getElementById('m-libelle').value = m ? m.libelle : '';
            document.getElementById('m-equipe').value = m ? m.equipe : 'salle';
            document.getElementById('m-debut').value = m ? hhmm(m.heure_debut) : '';
            document.getElementById('m-fin').value = m ? hhmm(m.heure_fin) : '';
            document.getElementById('m-pause').value = m ? m.pause_minutes : 30;
            document.getElementById('modele-modal').style.display = 'flex';
        }

        async function enregistrerModele() {
            const libelle = document.getElementById('m-libelle').value.trim();
            const heure_debut = document.getElementById('m-debut').value;
            const heure_fin = document.getElementById('m-fin').value;
            const pause_minutes = parseInt(document.getElementById('m-pause').value, 10) || 0;
            if (!libelle || !heure_debut || !heure_fin || heure_debut === heure_fin) { showToast('Nom et horaires obligatoires', 'error'); return; }
            const ligne = { etablissement: currentEstablishment, equipe: document.getElementById('m-equipe').value, libelle, heure_debut, heure_fin, pause_minutes };
            try {
                const r = modeleEdition
                    ? await sb.from('planning_modeles').update(ligne).eq('id', modeleEdition.id)
                    : await sb.from('planning_modeles').upsert({ ...ligne, actif: true }, { onConflict: 'etablissement,equipe,heure_debut,heure_fin,pause_minutes' });
                if (r.error) throw r.error;
                fermerModale('modele-modal');
                showToast('Horaire type enregistré', 'success');
                await recharger();
            } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur d’enregistrement', 'error'); }
        }

        function demanderRetraitModele(id) {
            const m = modeles.find(x => x.id === id);
            if (!m) return;
            openConfirm('Retirer « ' + m.libelle + ' » ?', 'Les horaires déjà posés sur le planning ne changent pas.', [{ label: 'Retirer', cls: 'danger', action: async () => {
                try {
                    const { error } = await sb.from('planning_modeles').update({ actif: false }).eq('id', id);
                    if (error) throw error;
                    showToast('Horaire type retiré', 'success');
                    await recharger();
                } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur de suppression', 'error'); }
            } }]);
        }

        // ============ SAISIE D UN HORAIRE ============
        function nouveauShift(userId, date) {
            if (!peutEditer()) return;
            ouvrirSaisie(userDe(userId), date, null);
        }
        function ouvrirShift(id) {
            const s = lignes.find(x => x.id === id);
            if (!s || !peutEditer()) return;
            ouvrirSaisie(userDe(s.user_id), s.date_service, s);
        }

        function ouvrirSaisie(u, date, s) {
            if (!u) { showToast('Salarié introuvable ou inactif', 'error'); return; }
            const equipe = s ? normEquipe(s.equipe) : equipeDe(u);
            edition = { user: u, date, shift: s, nature: s ? s.nature : 'travail', jours: new Set() };
            document.getElementById('s-titre').textContent = u.nom;
            document.getElementById('s-sub').textContent = libJour(date);
            document.getElementById('s-debut').value = s ? hhmm(s.heure_debut) : '';
            document.getElementById('s-fin').value = s ? hhmm(s.heure_fin) : '';
            document.getElementById('s-pause').value = s ? s.pause_minutes : 30;
            document.getElementById('s-equipe').value = equipe;
            document.getElementById('s-poste').value = s ? (s.poste || '') : '';

            const mods = modeles.filter(m => m.etablissement === currentEstablishment && m.equipe === equipe);
            document.getElementById('s-bloc-modeles').style.display = mods.length ? 'block' : 'none';
            document.getElementById('s-modeles').innerHTML = mods.map(m =>
                `<button class="chip" onclick="appliquerModele('${m.id}')">${esc(m.libelle)} ${hhmm(m.heure_debut)}–${hhmm(m.heure_fin)}</button>`).join('');

            document.getElementById('s-bloc-repeter').style.display = s ? 'none' : 'block';
            document.getElementById('s-jours').innerHTML = joursSemaine().map((d, i) => d === date ? '' :
                `<button class="chip" id="sj-${d}" onclick="basculerJour('${d}')">${JOURS_COURTS[i]} ${dateDe(d).getDate()}</button>`).join('');

            const btns = document.getElementById('s-btns');
            btns.innerHTML = '';
            const ajouter = (txt, cls, fn) => { const b = document.createElement('button'); b.textContent = txt; if (cls) b.className = cls; b.onclick = fn; btns.appendChild(b); };
            ajouter('Annuler', '', () => fermerModale('shift-modal'));
            if (s) ajouter('Supprimer', 'danger', demanderSuppression);
            ajouter('Enregistrer', 'primary', enregistrerShift);

            renderNatures();
            majDureeLive();
            document.getElementById('shift-modal').style.display = 'flex';
        }

        function renderNatures() {
            document.getElementById('s-natures').innerHTML = Object.keys(LIB_NATURE).map(n =>
                `<button class="chip${edition.nature === n ? ' on' : ''}" onclick="choisirNature('${n}')">${LIB_NATURE[n]}</button>`).join('');
            document.getElementById('s-bloc-travail').style.display = edition.nature === 'travail' ? 'block' : 'none';
        }
        function choisirNature(n) { edition.nature = n; renderNatures(); }
        function basculerJour(d) {
            if (edition.jours.has(d)) edition.jours.delete(d); else edition.jours.add(d);
            document.getElementById('sj-' + d).classList.toggle('on', edition.jours.has(d));
        }
        function appliquerModele(id) {
            const m = modeles.find(x => x.id === id);
            if (!m) return;
            document.getElementById('s-debut').value = hhmm(m.heure_debut);
            document.getElementById('s-fin').value = hhmm(m.heure_fin);
            document.getElementById('s-pause').value = m.pause_minutes;
            majDureeLive();
        }
        function majDureeLive() {
            const d = document.getElementById('s-debut').value, f = document.getElementById('s-fin').value;
            const p = parseInt(document.getElementById('s-pause').value, 10) || 0;
            const zone = document.getElementById('s-duree');
            if (!d || !f || d === f) { zone.textContent = ''; return; }
            const net = dureeBrute({ heure_debut: d, heure_fin: f }) - p;
            zone.textContent = 'Temps de travail : ' + hLib(net) + (f < d ? ' (finit le lendemain)' : '');
        }

        async function enregistrerShift() {
            const ed = edition;
            if (!ed) return;
            const base = {
                user_id: ed.user.id, etablissement: currentEstablishment, nature: ed.nature,
                saisi_par_id: currentUser.id, saisi_par_nom: currentUser.nom, updated_at: new Date().toISOString(),
            };
            if (ed.nature === 'travail') {
                const d = document.getElementById('s-debut').value, f = document.getElementById('s-fin').value;
                const p = parseInt(document.getElementById('s-pause').value, 10) || 0;
                if (!d || !f || d === f) { showToast('Heures de début et de fin obligatoires', 'error'); return; }
                if (p < 0 || dureeBrute({ heure_debut: d, heure_fin: f }) - p <= 0) { showToast('La pause dépasse la durée de l’horaire', 'error'); return; }
                Object.assign(base, { heure_debut: d, heure_fin: f, pause_minutes: p, equipe: document.getElementById('s-equipe').value, poste: document.getElementById('s-poste').value.trim() || null });
            } else {
                Object.assign(base, { heure_debut: null, heure_fin: null, pause_minutes: 0, equipe: equipeDe(ed.user), poste: null });
            }
            try {
                let r;
                if (ed.shift) {
                    r = await sb.from('planning_shifts').update({ ...base, date_service: ed.date }).eq('id', ed.shift.id);
                } else {
                    r = await sb.from('planning_shifts').insert([ed.date, ...ed.jours].map(date_service => ({ ...base, date_service })));
                }
                if (r.error) throw r.error;
                fermerModale('shift-modal');
                edition = null;
                await recharger();
            } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur d’enregistrement', 'error'); }
        }

        function demanderSuppression() {
            const ed = edition;
            if (!ed || !ed.shift) return;
            openConfirm('Supprimer cet horaire ?', ed.user.nom + ' — ' + libJour(ed.date), [{ label: 'Supprimer', cls: 'danger', action: async () => {
                try {
                    const { error } = await sb.from('planning_shifts').delete().eq('id', ed.shift.id);
                    if (error) throw error;
                    fermerModale('shift-modal');
                    edition = null;
                    await recharger();
                } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur de suppression', 'error'); }
            } }]);
        }

        // ============ AJOUT D UN SALARIE ============
        function ouvrirAjout() {
            const presents = new Set(salariesGrille().map(u => u.id));
            const dispo = users.filter(u => !presents.has(u.id));
            if (!dispo.length) { showToast('Tous les salariés actifs sont déjà affichés'); return; }
            document.getElementById('ajout-user').innerHTML = dispo.map(u => `<option value="${u.id}">${esc(u.nom)}</option>`).join('');
            document.getElementById('ajout-modal').style.display = 'flex';
        }
        function validerAjout() {
            ajoutsManuels.add(document.getElementById('ajout-user').value);
            fermerModale('ajout-modal');
            renderSemaine();
        }

        // ============ COPIE D UNE SEMAINE ============
        function ouvrirCopie() {
            document.getElementById('copie-sub').textContent = 'Les horaires sont recopiés sur la ' + libSemaine().toLowerCase() + '. Les absences de la semaine source ne sont pas copiées.';
            majDateCopie();
            document.getElementById('copie-modal').style.display = 'flex';
        }
        function majDateCopie() {
            const combo = document.getElementById('copie-source').value === 'combo';
            document.getElementById('copie-date').value = isoLocal(combo ? semaineDebut : addJours(semaineDebut, -7));
        }

        function lancerCopie() {
            const source = document.getElementById('copie-source').value;
            const date = document.getElementById('copie-date').value;
            if (!date) { showToast('Choisis une semaine', 'error'); return; }
            const lundi = lundiDe(dateDe(date));
            // Combo peut etre repris sur sa propre semaine, pour comparer aux vraies dates
            if (source === 'pbt' && isoLocal(lundi) === isoLocal(semaineDebut)) { showToast('Choisis une autre semaine que celle affichée', 'error'); return; }
            fermerModale('copie-modal');
            const existants = lignesSemaine().filter(s => ici(s) && s.nature === 'travail').length;
            if (existants) {
                openConfirm('Remplacer le brouillon ?', existants + ' horaire(s) déjà posés sur cette semaine seront remplacés. Les absences sont conservées, et le planning déjà publié ne change pas tant que tu ne publies pas.',
                    [{ label: 'Remplacer', cls: 'danger', action: () => copierSemaine(source, lundi) }]);
            } else {
                copierSemaine(source, lundi);
            }
        }

        function heureLocale(iso) { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

        async function lireSemaineSource(source, lundi) {
            const d1 = isoLocal(lundi), d2 = isoLocal(addJours(lundi, 6));
            if (source === 'pbt') {
                const { data, error } = await sb.from('planning_shifts').select('*').eq('etablissement', currentEstablishment)
                    .eq('nature', 'travail').gte('date_service', d1).lte('date_service', d2);
                if (error) throw error;
                return { lignes: data || [], ignores: 0 };
            }
            const reflet = await sb.from('planning_combo').select('*').eq('etablissement', currentEstablishment).gte('date_service', d1).lte('date_service', d2);
            if (reflet.error) throw reflet.error;
            if ((reflet.data || []).length) {
                const avecCompte = reflet.data.filter(c => userDe(c.user_id));
                return { lignes: avecCompte, ignores: reflet.data.length - avecCompte.length };
            }
            const { data, error } = await sb.from('combo_pointages')
                .select('date_service, user_id, equipe, debut_planifie, fin_planifiee, pauses_planifiees_minutes')
                .eq('etablissement', currentEstablishment).gte('date_service', d1).lte('date_service', d2);
            if (error) throw error;
            const planifies = (data || []).filter(c => c.debut_planifie && c.fin_planifiee);
            const rattaches = planifies.filter(c => c.user_id && userDe(c.user_id));
            return {
                ignores: planifies.length - rattaches.length,
                lignes: rattaches.map(c => ({
                    user_id: c.user_id, date_service: c.date_service, equipe: normEquipe(c.equipe), poste: null,
                    heure_debut: heureLocale(c.debut_planifie), heure_fin: heureLocale(c.fin_planifiee),
                    pause_minutes: c.pauses_planifiees_minutes || 0,
                })).filter(c => c.heure_debut !== c.heure_fin),
            };
        }

        async function copierSemaine(source, lundi) {
            try {
                const src = await lireSemaineSource(source, lundi);
                if (!src.lignes.length) { showToast('Aucun horaire trouvé sur cette semaine', 'error'); return; }
                const decalage = jourIndex(isoLocal(semaineDebut)) - jourIndex(isoLocal(lundi));
                let horsContrat = 0;
                const nouvelles = [];
                for (const s of src.lignes) {
                    if (!userDe(s.user_id)) continue;
                    const date_service = isoLocal(addJours(dateDe(s.date_service), decalage));
                    if (contrats.some(c => c.user_id === s.user_id) && !contratAu(s.user_id, date_service)) { horsContrat++; continue; }
                    nouvelles.push({
                        user_id: s.user_id, date_service, etablissement: currentEstablishment, nature: 'travail', equipe: normEquipe(s.equipe),
                        heure_debut: hhmm(s.heure_debut), heure_fin: hhmm(s.heure_fin), pause_minutes: s.pause_minutes || 0, poste: s.poste || null,
                        saisi_par_id: currentUser.id, saisi_par_nom: currentUser.nom,
                    });
                }
                const j = joursSemaine();
                const { error: e1 } = await sb.from('planning_shifts').delete().eq('etablissement', currentEstablishment).eq('nature', 'travail').gte('date_service', j[0]).lte('date_service', j[6]);
                if (e1) throw e1;
                if (nouvelles.length) {
                    const { error: e2 } = await sb.from('planning_shifts').insert(nouvelles);
                    if (e2) throw e2;
                }
                const notes = [];
                if (horsContrat) notes.push(horsContrat + ' hors contrat');
                if (src.ignores) notes.push(src.ignores + ' sans compte PlanB-Tools');
                showToast(nouvelles.length + ' horaires copiés' + (notes.length ? ' (ignorés : ' + notes.join(', ') + ')' : ''), 'success');
                await recharger();
            } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur de copie', 'error'); }
        }

        // ============ PUBLICATION ============
        function demanderPublication() {
            const graves = calculerAlertes().filter(a => a.g && salariesGrille().some(u => u.id === a.uid));
            const texte = (graves.length
                ? graves.length + ' alerte(s) à corriger restent sur cette semaine :\n' + graves.slice(0, 5).map(a => '• ' + a.nom + ' : ' + a.txt).join('\n') + (graves.length > 5 ? '\n…' : '') + '\n\n'
                : '') + (joursSemaine()[6] >= DATE_BASCULE
                    ? 'Les salariés verront ce planning et le Briefing et le TAF seront mis à jour.'
                    : 'Les salariés concernés devront signer à nouveau si leurs horaires ont changé. Le Briefing et le TAF restent alimentés par Combo jusqu’à la bascule.');
            openConfirm('Publier cette semaine ?', texte, [{ label: graves.length ? 'Publier quand même' : 'Publier', cls: graves.length ? 'danger' : 'primary', action: publier }]);
        }

        async function publier() {
            try {
                const { data, error } = await sb.rpc('pbt_planning_publier', { p_etab: currentEstablishment, p_lundi: isoLocal(semaineDebut) });
                if (error) throw error;
                showToast('Planning publié (version ' + data.version + ')', 'success');
                await recharger();
            } catch (e) { console.error(e); if (PLANB.erreurAuth(e)) return; showToast('Erreur de publication', 'error'); }
        }

        // ============ COMMUN ============
        function openConfirm(titre, texte, boutons) {
            document.getElementById('confirm-titre').textContent = titre;
            document.getElementById('confirm-texte').textContent = texte;
            const zone = document.getElementById('confirm-btns');
            zone.innerHTML = '';
            const close = () => { document.getElementById('confirm-modal').style.display = 'none'; };
            [{ label: 'Annuler', cls: '', action: null }, ...boutons].forEach(b => {
                const btn = document.createElement('button');
                btn.textContent = b.label;
                if (b.cls) btn.className = b.cls;
                btn.onclick = async () => { close(); if (b.action) await b.action(); };
                zone.appendChild(btn);
            });
            document.getElementById('confirm-modal').style.display = 'flex';
        }

        function renderTabs() {
            const tabs = peutGerer
                ? [['semaine', '🗓️ Semaine'], ['jour', '📍 Jour'], ['pointages', '⏰ Pointages'], ['signatures', '✍️ Signatures'], ['modeles', '⏱️ Horaires types'], ['moi', '👤 Mon planning']]
                : [['moi', '👤 Mon planning'], ['semaine', '🗓️ L’équipe']];
            document.getElementById('tabs').innerHTML = tabs.map(t =>
                `<button class="pl-tab${onglet === t[0] ? ' active' : ''}" onclick="changerOnglet('${t[0]}')">${t[1]}</button>`).join('');
        }

        async function changerSemaine(delta) {
            semaineDebut = addJours(semaineDebut, 7 * delta);
            ajoutsManuels = new Set();
            await recharger();
        }

        async function changerJour(delta) {
            const nouveau = addJours(dateDe(jourCourant), delta);
            jourCourant = isoLocal(nouveau);
            const lundi = lundiDe(nouveau);
            if (isoLocal(lundi) !== isoLocal(semaineDebut)) { semaineDebut = lundi; await recharger(); }
            else renderJour();
        }

        function changerOnglet(o) {
            onglet = o;
            try { sessionStorage.setItem('planning_onglet', o); } catch (e) {}
            renderTabs();
            recharger();
        }

        async function recharger() {
            try {
                await chargerSemaine();
                if (onglet === 'jour') {
                    const j = joursSemaine();
                    if (!j.includes(jourCourant)) jourCourant = j.includes(isoLocal(new Date())) ? isoLocal(new Date()) : j[0];
                    renderJour();
                } else if (onglet === 'pointages') { await chargerPointages(); renderPointages(); }
                else if (onglet === 'signatures') { await chargerSignatures(); renderSignatures(); }
                else if (onglet === 'modeles') renderModeles();
                else if (onglet === 'moi') {
                    await chargerSignatures();
                    if (peutGerer) {
                        const j = joursSemaine();
                        const { data, error } = await sb.from('planning_publies').select('*').eq('user_id', currentUser.id).gte('date_service', j[0]).lte('date_service', j[6]);
                        if (error) throw error;
                        monPublie = data || [];
                    }
                    renderMoi();
                } else renderSemaine();
            } catch (e) {
                console.error(e);
                if (PLANB.erreurAuth(e)) return;
                const msg = String(e && (e.message || e.code) || '');
                document.getElementById('main').innerHTML = (msg.includes('planning_') || String(e.code) === '42P01' || String(e.code) === 'PGRST205')
                    ? '<div class="empty">Module pas encore initialisé côté base de données.<br>(migration scripts/migration-planning.sql à exécuter)</div>'
                    : '<div class="empty">Erreur de chargement des données.</div>';
                showToast('Erreur de chargement', 'error');
            }
        }

        (async function init() {
            document.getElementById('etab-badge').textContent = currentEstablishment === 'freddy' ? '🏪 Freddy' : '🍽️ Liesel';
            semaineDebut = lundiDe(new Date());
            jourCourant = isoLocal(new Date());
            let o = onglet;
            try {
                o = sessionStorage.getItem('planning_onglet') || onglet;
                vue = sessionStorage.getItem('planning_vue') === 'brouillon' ? 'brouillon' : 'combo';
            } catch (e) {}
            if (isoLocal(semaineDebut) >= DATE_BASCULE) vue = 'brouillon';
            const permis = peutGerer ? ['semaine', 'jour', 'pointages', 'signatures', 'modeles', 'moi'] : ['moi', 'semaine'];
            changerOnglet(permis.includes(o) ? o : permis[0]);
        })();
    </script>
</body>
</html>
